spring:
  datasource:
    url: jdbc:h2:mem:ledgerdb;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.OracleDialect
    open-in-view: false
  flyway:
    enabled: true
eureka:
  client:
    enabled: false
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
moneybags:
  ledger:
    fake-accounts:
      enabled: true
      accounts:
        10001:
          customer-id: 101
          currency-code: INR
          status: ACTIVE
        20001:
          customer-id: 202
          currency-code: INR
          status: ACTIVE
