server:
  port: 8085

spring:
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  application:
    name: ledger-service
  datasource:
    url: ${DBURL}
    username: ${DBUSER}
    password: ${DBPASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.OracleDialect
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    table: flyway_ledger_history
    baseline-on-migrate: true
    baseline-version: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8080/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

moneybags:
  ledger:
    default-currency: INR
    accounts:
      cash-asset: "110100"
      account-deposit-control: "210000"
      internal-clearing: "220100"
      external-clearing: "220200"
      fee-income: "410100"
    fake-accounts:
      enabled: true
      accounts:
        10001:
          customer-id: 101
          currency-code: INR
          status: ACTIVE
        20001:
          customer-id: 202
          currency-code: INR
          status: ACTIVE
