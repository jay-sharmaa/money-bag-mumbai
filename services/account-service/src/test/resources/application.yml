spring:
  datasource:
    url: jdbc:h2:mem:accountdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: false
  cloud:
    discovery:
      enabled: false
eureka:
  client:
    enabled: false
moneybags:
  account:
    interest:
      enabled: false
