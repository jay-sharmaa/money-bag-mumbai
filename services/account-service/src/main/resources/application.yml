server:
  port: 8083
  forward-headers-strategy: framework

spring:
  application:
    name: account-service
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:mysql://localhost:3306/moneybags_account?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${ACCOUNT_DB_USERNAME:root}
    password: ${ACCOUNT_DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

moneybags:
  account:
    default-currency: INR
    dormancy-days: 365
    outbox:
      enabled: true
      batch-size: 50
      max-attempts: 10
      fixed-delay-ms: 5000
    reconciliation:
      enabled: true
      fixed-delay-ms: 60000
    interest:
      enabled: true
      check-delay-ms: 60000
      initial-delay-ms: 10000
      first-period-end: 2026-08-16
      run-hour-utc: 0
      run-minute-utc: 10
      max-catch-up-runs: 52
      stale-after-minutes: 30
      retry-delay-minutes: 5

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8080/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
