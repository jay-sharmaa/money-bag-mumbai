server:
  port: 8084
  forward-headers-strategy: framework
spring:
  application:
    name: transaction-service
  datasource:
    url: ${TRANSACTION_DB_URL:jdbc:mysql://localhost:3306/moneybags_transaction?createDatabaseIfNotExist=true}
    username: ${TRANSACTION_DB_USERNAME:root}
    password: ${TRANSACTION_DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8080/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
moneybags:
  transaction:
    default-currency: INR
    mini-statement-size: 10
    outbox:
      batch-size: 50
      fixed-delay-ms: 5000
      max-attempts: 10
    ledger:
      cash-asset: "110100"
      account-deposit-control: "210000"
      term-deposit-control: "210100"
      internal-clearing: "220100"
      external-clearing: "220200"
      fee-income: "410100"
      savings-interest-expense: "510100"
