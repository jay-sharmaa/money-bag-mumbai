server:
  port: 8086
spring:
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  application:
    name: statement-reporting-service
  datasource:
    url: ${DBURL}
    username: ${DBUSER}
    password: ${DBPASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate.ddl-auto: validate
    database-platform: org.hibernate.dialect.OracleDialect
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    table: flyway_statement_history
    baseline-on-migrate: true
    baseline-version: 0
eureka.client.service-url.defaultZone: http://localhost:8080/eureka/
management.endpoints.web.exposure.include: health,info,metrics
springdoc:
  api-docs.path: /api-docs
  swagger-ui.path: /swagger-ui.html
moneybags.statement:
  storage-directory: ${STATEMENT_STORAGE_DIR:./data/statements}
  download-secret: ${STATEMENT_DOWNLOAD_SECRET:change-this-development-secret-before-production}
  download-link-minutes: 10
  file-retention-days: 30
  worker-delay-ms: 2000
  account-service-url: ${ACCOUNT_SERVICE_URL:http://localhost:8083}
  transaction-service-url: ${TRANSACTION_SERVICE_URL:http://localhost:8084}
  source-connect-timeout-ms: 1000
  source-read-timeout-ms: 3000
