spring:
  datasource:
    url: jdbc:h2:mem:statementdb;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate.ddl-auto: none
    database-platform: org.hibernate.dialect.OracleDialect
    open-in-view: false
  flyway.enabled: true
eureka.client.enabled: false
moneybags.statement:
  storage-directory: ./target/test-statements
  download-secret: test-secret-that-is-long-enough
  worker-enabled: false
