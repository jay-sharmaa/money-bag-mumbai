server:
  port: 8084
spring:
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  application:
    name: transaction-service
  datasource:
    url: ${DBURL}
    username: ${DBUSER}
    password: ${DBPASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.OracleDialect
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    table: flyway_transaction_history
    baseline-on-migrate: true
    baseline-version: 0
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8080/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
moneybags:
  transaction:
    ledger-service-url: ${LEDGER_SERVICE_URL:http://localhost:8085}
    statement-service-url: ${STATEMENT_SERVICE_URL:http://localhost:8086}
    default-currency: INR
    mini-statement-size: 10
    outbox:
      batch-size: 50
      fixed-delay-ms: 5000
      max-attempts: 10
    ledger:
      cash-asset: "110100"
      account-deposit-control: "210000"
      internal-clearing: "220100"
      external-clearing: "220200"
      fee-income: "410100"
