spring:
  datasource:
    url: jdbc:h2:mem:transactiondb;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.OracleDialect
    open-in-view: false
  flyway:
    enabled: true
eureka:
  client:
    enabled: false
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
moneybags:
  transaction:
    outbox:
      enabled: false
